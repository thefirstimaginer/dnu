# ==============================================================================
# DNU (Dreamcore Kernel)
# ==============================================================================
#
# Este repositório não depende do repositório do ImagineOS para construir:
#
#   make dzImage      # o único artefato publicado (kernel + initramfs)
#   make test         # suíte do kernel no host
#
# A ABI usada pelo kernel e pelo carregador de DEF é o crate
# `imagineos_abi`, cuja definição canônica está em imagine-base/abi/.
# O DNU consome o dzImage gerado por este repositório.

[package]
name = "imagineos-dnu-kernel"
version = "0.1.0"
edition = "2024"

[workspace]
# `imagine-base/abi` é workspace próprio: o kernel aplica `panic = "abort"`,
# mas ferramentas de host e testes linkam a ABI com unwinding.
exclude = ["../imagine-base/abi"]
resolver = "2"

[features]
# Ativa logs de diagnóstico extras (processo, serial numérica, ramfs).
kernel-debug = []

[dependencies]
imagineos_abi = { path = "../imagine-base/abi" }
limine = "0.5.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[bin]]
name = "imagineos-dnu-kernel"
path = "src/main.rs"
