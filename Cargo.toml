# ==============================================================================
# DNU (Dreamcore Kernel)
# ==============================================================================
#
# Este repositório não depende do repositório do ImagineOS para construir:
#
#   make dzImage      # o único artefato publicado (kernel + initramfs)
#   make test         # suíte do kernel no host
#
# A ABI canônica do kernel vive em `dnu/abi/` (crate `dnu-abi`). O DNU consome
# o dzImage gerado por este repositório.

[package]
name = "imagineos-dnu-kernel"
version = "0.1.0"
edition = "2024"

[workspace]
# `dnu-abi` é o contrato de ABI do kernel (em `dnu/abi/`). Ferramentas de host
# e testes podem linkar com unwinding; o kernel aplica `panic = "abort"`.
resolver = "2"

[features]
# Ativa logs de diagnóstico extras (processo, serial numérica, ramfs).
kernel-debug = []
# Compila para boot direto via dnuboot: linker script em endereço baixo
# (identity-mapped), entry point _direct_start, sem dependência do Limine.
direct-boot = []

[dependencies]
limine = "0.5.0"
dnu-abi = { path = "abi" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[bin]]
name = "imagineos-dnu-kernel"
path = "src/main.rs"
